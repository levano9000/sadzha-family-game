<style>
:root{--bg:#fff7ec;--card:#fff;--ink:#3a2a1f;--mute:#8a7563;--line:#f0dfc8;--acc:#e8743b;--good:#3a9d5d;--bad:#d24b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:34px;margin:8px 0 4px;text-align:center}
h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--mute);text-align:center;max-width:640px;margin:0 auto 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 0 var(--line)}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ch{cursor:pointer;transition:transform .15s}
.ch:hover{transform:translateY(-3px)}
.ch .em{font-size:44px}
.ch b{font-size:19px}
.ch small{display:block;color:var(--mute);margin-top:6px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.stat{display:flex;gap:14px;flex-wrap:wrap;font-weight:600}
.bar{display:inline-block;width:70px;height:8px;background:var(--line);border-radius:5px;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.house{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:480px){.house{grid-template-columns:repeat(2,1fr)}}
.room{border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;background:#fffdf9;min-height:74px}
.room.here{border-color:var(--acc);background:#fff1e6}
.room .rn{font-size:13px;font-weight:700}
.room .ppl{font-size:24px;letter-spacing:2px;margin-top:4px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;border:0;border-radius:10px;padding:9px 12px;background:#ffe3cf;color:var(--ink);cursor:pointer}
button:hover:not(:disabled){background:#ffd2b3}
button:disabled{opacity:.45;cursor:default}
button.main{background:var(--acc);color:#fff;font-weight:700}
.say{background:#f7f1ff;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
.log{font-size:14px;max-height:220px;overflow:auto}
.log div{padding:5px 0;border-bottom:1px dashed var(--line)}
.log div:first-child{font-weight:600}
.q div{margin:4px 0;font-size:15px}
.done{color:var(--good);text-decoration:line-through}
.rels{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:14px}
.sec{margin-top:12px}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:420px;width:100%;text-align:center}
.modal .big{font-size:48px}
.end p{margin:8px 0}
.pop{animation:pop .3s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
</style>
</head>

function ppl(room){return ALL.filter(id=>id!==S.me&&S.pos[id]===room)}
function targets(w){const l=w==='all'?ALL:(Array.isArray(w)?w:GROUP[w]);return l.filter(x=>x!==S.me&&S.pos[x]===S.room)}
function fill(s,id){return s.replace(/\{n\}/g,id?P[id].n:'')}
function apply(o,who){
 S.en=clamp(S.en+(o.e||0));S.mo=clamp(S.mo+(o.m||0));
 if(who&&o.rl)S.rel[who]=clamp(S.rel[who]+o.rl);
 if(o.rel)for(const k in o.rel)if(k!==S.me)S.rel[k]=clamp(S.rel[k]+o.rel[k]);
 if(o.all)ALL.forEach(k=>{if(k!==S.me)S.rel[k]=clamp(S.rel[k]+o.all)});
}
function act(i,who){
 const a=allActions()[i];let msg;
 if(a.bunny){
  apply(a);
  if(S.q.bunny)msg='Буся уже у вас в обнимку.';
  else if(S.room===S.bunny){S.q.bunny=1;S.mo=clamp(S.mo+25);msg='🐰 УРА! Буся нашёлся! Он спал под подушкой!'}
  else msg=rnd(['Здесь Буси нет… Только носок Лео.','Под диваном пусто. Может, в другой комнате?','Буси нет. Зато нашлась конфета!'])+' (Подсказка: '+ROOMS[S.bunny][1].slice(0,1)+'…)';
 }else if(a.p&&Math.random()<a.p){apply(a.f,who);msg=fill(a.f.log,who)}
 else{apply(a,who);if(a.q)S.q[a.q]=(S.q[a.q]||0)+1;msg=fill(a.log,who);if(a.once)S.gifted.add(who)}
 S.log.unshift(`${S.h}:00 — ${msg}`);
 nextHour();
}
function nextHour(){
 S.h++;moveNPC();
 if(S.h===14&&S.me!=='so')S.log.unshift('14:00 — 🚗 Приехала Соня! Все бегут её обнимать.');
 if(S.h>=21)return end();
 render();
 if(Math.random()<.3)event();
}
function event(){
 const list=EV.filter((x,i)=>!S.seen.has(i)&&!(x.not||[]).includes(S.me)&&(!x.only||x.only.includes(S.me)));
 if(!list.length)return;
 const ev=rnd(list);S.seen.add(EV.indexOf(ev));
 const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="card pop"><div class="big">${ev.e}</div><p><b>${ev.t}</b></p><div class="btns" style="justify-content:center"></div></div>`;
 ev.c.forEach(([t,o])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{apply(o);S.log.unshift(`${S.h}:00 — ${ev.e} ${t}`);m.remove();render()};m.querySelector('.btns').append(b)});
 document.body.append(m);
}
function allActions(){return A[S.me].concat(COMMON)}
function qDone(){return Q[S.me].s.filter(([k,,n])=>(S.q[k]||0)>=n).length}
function go(r){S.room=r;const p=ppl(r);if(p.length)S.say=[p[0],rnd(P[p[0]].say)];else S.say=null;render()}
function bar(v){return `<span class="bar"><i style="width:${v}%"></i></span>`}
function render(){
 const me=P[S.me],here=ppl(S.room);
 let btns='';
 allActions().forEach((a,i)=>{
  if(!a.r.includes(S.room))return;
  const tired=a.e<0&&S.en+a.e<0;
  if(a.w){targets(a.w).filter(id=>!(a.once&&S.gifted.has(id))).forEach(id=>btns+=`<button ${tired?'disabled':''} onclick="act(${i},'${id}')">${fill(a.t,id)}</button>`)}
  else btns+=`<button ${tired?'disabled':''} onclick="act(${i})">${a.t}${tired?' (нет сил)':''}</button>`;
 });
 $('#app').innerHTML=`
 <div class="top card"><div><b style="font-size:20px">${me.e} ${me.n}</b> <span style="color:var(--mute)">· ${me.r}</span></div>
 <div class="stat"><span>🕐 ${S.h}:00</span><span>⚡ ${bar(S.en)}</span><span>😊 ${bar(S.mo)}</span></div></div>
 <div class="grid">
  <div>
   <div class="card"><h2>🏠 Дом Саджая <small style="color:var(--mute);font-weight:400">— нажмите на комнату, чтобы перейти</small></h2>
   <div class="house">${Object.entries(ROOMS).map(([k,[i,n]])=>`<div class="room ${k===S.room?'here':''}" onclick="go('${k}')"><div class="rn">${i} ${n}</div><div class="ppl">${k===S.room?me.e:''}${ppl(k).map(x=>P[x].e).join('')}</div></div>`).join('')}</div></div>
   <div class="card sec"><h2>${ROOMS[S.room][0]} ${ROOMS[S.room][1]}${here.length?': '+here.map(x=>P[x].n).join(', '):' (никого)'}</h2>
   ${S.say&&here.includes(S.say[0])?`<div class="say">${P[S.say[0]].e} <b>${P[S.say[0]].n}:</b> «${S.say[1]}»</div>`:''}
   <div class="btns">${btns||'<i style="color:var(--mute)">Здесь нечего делать, перейдите в другую комнату.</i>'}</div></div>
  </div>
  <div>
   <div class="card q"><h2>🎯 ${Q[S.me].t}</h2>${Q[S.me].s.map(([k,t,n])=>{const v=Math.min(S.q[k]||0,n);return `<div class="${v>=n?'done':''}">${v>=n?'✅':'⬜'} ${t} (${v}/${n})</div>`}).join('')}</div>
   <div class="card sec"><h2>❤️ Отношения</h2><div class="rels">${ALL.filter(x=>x!==S.me).map(x=>`<span>${P[x].e} ${P[x].n}</span><span>${bar(S.rel[x])}</span>`).join('')}</div></div>
   <div class="card sec"><h2>📜 Что происходит</h2><div class="log">${S.log.slice(0,10).map(l=>`<div>${l}</div>`).join('')}</div></div>
  </div>
 </div>
 <p style="text-align:center"><button onclick="menu()">↩ Сменить персонажа</button></p>`;
}
function end(){
 const me=P[S.me],qs=Q[S.me].s,d=qDone();
 const others=ALL.filter(x=>x!==S.me),avg=others.reduce((s,x)=>s+S.rel[x],0)/others.length;
 const score=Math.round(d/qs.length*50+avg*.3+S.mo*.2);
 const title=score>=85?'🏆 Сердце семьи Саджая':score>=70?'🌟 Лучший день в году':score>=55?'😊 Хорошая суббота':score>=40?'🙂 Обычный денёк':'😅 Ну, бывает…';
 const best=others.reduce((a,b)=>S.rel[a]>=S.rel[b]?a:b);
 const lines=[];
 if(S.q.cook>=2)lines.push('На столе мамины хинкали. Все тянутся за добавкой.');
 if(S.q.bbq>=2)lines.push('Папин шашлык удался. Тимур съел пять шампуров.');
 if(S.q.art>=2)lines.push('На стене висит картина Евы «Семья Саджая». Мама прослезилась.');
 if(S.q.poem>=1)lines.push('Ева рассказала стихотворение без единой ошибки.');
 if(S.q.bunny)lines.push('Мия сидит за столом в обнимку с Бусей.');
 if(S.q.tt>=2)lines.push('Ева и Мия показывают всем свой новый TikTok. Уже 10 000 просмотров!');
 if(S.q.gift>=3)lines.push('Младшие не отходят от Сони и хвастаются подарками.');
 if(S.q.chat>=2)lines.push('Тимур весь ужин улыбается в телефон. Кажется, у него свидание!');
 if(S.q.proj>=2)lines.push('Тимур рассказывает, сколько семья тратит на конфеты. Мия делает вид, что не слышит.');
 if(S.q.fifa>=2)lines.push(S.me==='leo'?'Лео всем рассказывает, как обыграл Тимура.':'Тимур защитил титул чемпиона FIFA.');
 if(S.q.fix>=2)lines.push('Кран на кухне больше не капает. Папа — герой!');
 if(S.q.goal>=5)lines.push('Лео забил 5 голов. Ваза… об этом лучше не говорить.');
 if(!lines.length)lines.push('Все устали, но довольны. Дома тепло и шумно.');
 $('#app').innerHTML=`<div class="card end pop" style="max-width:620px;margin:20px auto;text-align:center">
 <div style="font-size:54px">🍽️</div><h2 style="font-size:24px">21:00 — семейный ужин</h2>
 <p>Вся семья Саджая собралась за большим столом: ${ALL.map(x=>P[x].e).join(' ')}</p>
 ${lines.map(l=>`<p>• ${l}</p>`).join('')}
 <p style="margin-top:16px">${me.e} <b>${me.n}</b>: квестов выполнено ${d} из ${qs.length}, ближе всех сегодня ${P[best].e} ${P[best].n}</p>
 <h2 style="font-size:26px;margin-top:14px">${title}</h2><p>Счёт: <b>${score}</b> / 100</p>
 <div class="btns" style="justify-content:center"><button class="main" onclick="start('${S.me}')">Сыграть ещё раз</button><button onclick="menu()">Другой персонаж</button></div></div>`;
}
function menu(){
 $('#app').innerHTML=`<h1>🏡 Семья Саджая</h1>
 <p class="sub">Суббота. В 21:00 вся семья соберётся на праздничный ужин. До этого у каждого есть свои дела, планы и маленькие мечты. Выберите, за кого играть, и проживите этот день: ходите по дому, общайтесь с родными, выполняйте задания и попробуйте сделать этот день лучшим в году!</p>
 <div class="chars">${ALL.map(id=>`<div class="card ch" onclick="start('${id}')"><div class="em">${P[id].e}</div><b>${P[id].n}</b><div style="color:var(--acc);font-weight:600">${P[id].r}</div><small>🎯 ${Q[id].t}: ${Q[id].s.map(s=>s[1].toLowerCase()).join(', ')}</small></div>`).join('')}</div>`;
}
menu();
</script>
</body>
</html>
